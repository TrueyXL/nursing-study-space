<title>Nursing Study Space</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap">
<style>
/* Layout: calm two-pane app — sidebar on desktop, bottom tab bar on phone. One soft surface per section, no heavy chrome. */
:root{
  --bg:#FCEEF2; --surface:#FFFFFF; --surface2:#F8E3EA; --fg:#3A2730; --muted:#866874; --line:#EFD5DE;
  --accent:#B9426F; --accent-ink:#FFFFFF; --soft:#F7D6E2; --ok:#2E7D5B; --warn:#B26A00; --bad:#B3261E;
  --display:"Outfit",ui-sans-serif,system-ui,sans-serif; --body:"Figtree",ui-sans-serif,system-ui,-apple-system,sans-serif;
  --r:14px; --shadow:0 1px 2px rgba(60,20,40,.05),0 6px 20px rgba(60,20,40,.05);
}
:root[data-palette="navy"]{--bg:#EDF2F8;--surface:#FFFFFF;--surface2:#E0E8F2;--fg:#1C2939;--muted:#5D6F84;--line:#D4DEEA;--accent:#2A5592;--soft:#D3E0F1}
:root[data-palette="forest"]{--bg:#EEF3EE;--surface:#FFFFFF;--surface2:#E0EAE2;--fg:#1F2D24;--muted:#5F7265;--line:#D4E1D7;--accent:#2E6747;--soft:#D3E6D9}
:root[data-palette="charcoal"]{--bg:#EFF0F1;--surface:#FFFFFF;--surface2:#E3E5E8;--fg:#202328;--muted:#646A73;--line:#D8DBDF;--accent:#3C4654;--soft:#DADEE4}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){--bg:#1E1619;--surface:#2A1F24;--surface2:#33262C;--fg:#F5E6EC;--muted:#BFA2AE;--line:#43323A;--accent:#F08BB3;--accent-ink:#2A121C;--soft:#4A2B39;--ok:#7BD3A6;--warn:#F2B661;--bad:#FF8A80;color-scheme:dark}
  :root:not([data-theme="light"])[data-palette="navy"]{--bg:#131A23;--surface:#1B2430;--surface2:#222D3B;--fg:#E5ECF5;--muted:#9AABC0;--line:#2E3A4A;--accent:#8DB4EC;--accent-ink:#0F1B2C;--soft:#253A57}
  :root:not([data-theme="light"])[data-palette="forest"]{--bg:#141A16;--surface:#1C241F;--surface2:#232D27;--fg:#E3EEE6;--muted:#9DB2A3;--line:#2E3B33;--accent:#86C9A2;--accent-ink:#0F2017;--soft:#24402F}
  :root:not([data-theme="light"])[data-palette="charcoal"]{--bg:#16171A;--surface:#1F2125;--surface2:#272A2F;--fg:#E8EAED;--muted:#A2A8B1;--line:#33363C;--accent:#B9C3D1;--accent-ink:#16181C;--soft:#343A44}
}
:root[data-theme="dark"]{--bg:#1E1619;--surface:#2A1F24;--surface2:#33262C;--fg:#F5E6EC;--muted:#BFA2AE;--line:#43323A;--accent:#F08BB3;--accent-ink:#2A121C;--soft:#4A2B39;--ok:#7BD3A6;--warn:#F2B661;--bad:#FF8A80;color-scheme:dark}
:root[data-theme="dark"][data-palette="navy"]{--bg:#131A23;--surface:#1B2430;--surface2:#222D3B;--fg:#E5ECF5;--muted:#9AABC0;--line:#2E3A4A;--accent:#8DB4EC;--accent-ink:#0F1B2C;--soft:#253A57}
:root[data-theme="dark"][data-palette="forest"]{--bg:#141A16;--surface:#1C241F;--surface2:#232D27;--fg:#E3EEE6;--muted:#9DB2A3;--line:#2E3B33;--accent:#86C9A2;--accent-ink:#0F2017;--soft:#24402F}
:root[data-theme="dark"][data-palette="charcoal"]{--bg:#16171A;--surface:#1F2125;--surface2:#272A2F;--fg:#E8EAED;--muted:#A2A8B1;--line:#33363C;--accent:#B9C3D1;--accent-ink:#16181C;--soft:#343A44}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:16px/1.55 var(--body);-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--display);font-weight:600;line-height:1.2;text-wrap:balance;margin:0}
h1{font-size:1.75rem} h2{font-size:1.2rem} h3{font-size:1rem}
p{margin:0}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}
.muted{color:var(--muted)} .small{font-size:.875rem} .tiny{font-size:.78rem}
.label{font-size:.75rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* shell */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:100vh;padding:22px 14px;padding-left:max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px;border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-family:var(--display);font-weight:700}
.brand b{font-family:var(--display);font-size:1.05rem;display:block;line-height:1.1}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:12px;padding:9px 10px;border-radius:10px;color:var(--fg);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface2)}
.nav a[aria-current="page"]{background:var(--soft);color:var(--fg);font-weight:600}
.nav svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:10px;padding:0 8px}
main{min-width:0;padding-block:28px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1020px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin-top:4px}

.tabbar{display:none}
.sheet-bg{position:fixed;inset:0;background:rgba(0,0,0,.28);z-index:40}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--surface);border-radius:20px 20px 0 0;padding:18px max(16px,env(safe-area-inset-right,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:14px;box-shadow:0 -10px 30px rgba(0,0,0,.12)}
.sheet .nav a{padding:12px}

@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{display:none}
  main{padding-block:18px calc(92px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding:6px max(6px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(6px,env(safe-area-inset-left,0px))}
  .tabbar a,.tabbar button{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 2px;font-size:.72rem;color:var(--muted);text-decoration:none;background:none;border:0;border-radius:10px;font-weight:600}
  .tabbar [aria-current="page"]{color:var(--accent)}
  .tabbar svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  h1{font-size:1.45rem}
}

/* building blocks */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:12px;min-width:0}
.grid{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr))}
.grid-2{display:grid;gap:16px;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr)}
@media (max-width:900px){.grid-2{grid-template-columns:minmax(0,1fr)}}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.row.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:999px;font-weight:600;cursor:pointer;min-height:40px;text-decoration:none;color:var(--fg)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.sm{padding:5px 11px;min-height:32px;font-size:.875rem}
.btn.danger{color:var(--bad)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
input[type=text],input[type=date],input[type=number],input[type=search],select,textarea{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px 12px;min-height:42px}
textarea{resize:vertical;min-height:90px;line-height:1.5}
input:focus,select:focus,textarea:focus{outline:2px solid var(--soft);border-color:var(--accent)}
label.f{display:flex;flex-direction:column;gap:5px;font-size:.85rem;font-weight:600;color:var(--muted);min-width:0;flex:1}
.form-row{display:flex;gap:10px;flex-wrap:wrap}
.form-row>*{flex:1 1 150px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;background:var(--surface2);font-size:.8rem;font-weight:600;white-space:nowrap}
.chip.accent{background:var(--soft)}
.chip.exam{background:color-mix(in srgb,var(--bad) 14%,transparent);color:var(--bad)}
.chip.clinical{background:color-mix(in srgb,var(--ok) 15%,transparent);color:var(--ok)}
.chip.assignment{background:color-mix(in srgb,var(--warn) 16%,transparent);color:var(--warn)}
.pills{display:flex;gap:6px;flex-wrap:wrap}
.pill{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 13px;font-weight:600;font-size:.875rem;cursor:pointer}
.pill[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);min-width:0}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .t{font-weight:600;overflow-wrap:anywhere}
.check{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);background:var(--surface);flex:none;cursor:pointer;display:grid;place-items:center;padding:0}
.check[aria-checked="true"]{background:var(--accent);border-color:var(--accent)}
.check[aria-checked="true"]::after{content:"";width:9px;height:5px;border:2px solid var(--accent-ink);border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.done .t{text-decoration:line-through;color:var(--muted)}
.empty{padding:22px;border:1.5px dashed var(--line);border-radius:var(--r);text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.stat{font-family:var(--display);font-size:1.9rem;font-weight:600;line-height:1;font-variant-numeric:tabular-nums}
.banner{padding:10px 14px;border-radius:12px;background:var(--surface2);font-size:.875rem;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.iconbtn{width:36px;height:36px;border-radius:10px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer;color:var(--muted);flex:none}
.iconbtn:hover{background:var(--surface2);color:var(--fg)}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}

/* theme swatches */
.swatches{display:flex;gap:8px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line);cursor:pointer;padding:0}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--fg)}

/* assistant */
.chat{display:flex;flex-direction:column;gap:14px;min-height:320px}
.msg{max-width:100%;padding:12px 15px;border-radius:14px;line-height:1.6;min-width:0;overflow-wrap:anywhere}
.msg.u{align-self:flex-end;background:var(--soft);max-width:85%;white-space:pre-wrap}
.msg.a{align-self:stretch;background:var(--surface);border:1px solid var(--line)}
.msg.a h1,.msg.a h2,.msg.a h3{font-size:1.02rem;margin:10px 0 4px}
.msg.a p{margin:6px 0} .msg.a ul,.msg.a ol{margin:6px 0;padding-left:22px}
.msg.a table{border-collapse:collapse;font-size:.9rem;margin:8px 0}
.msg.a th,.msg.a td{border:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.msg.a code{background:var(--surface2);padding:1px 5px;border-radius:5px;font-size:.9em}
.tbl{overflow-x:auto;max-width:100%}
.composer{position:sticky;bottom:0;background:var(--bg);padding-top:8px;display:flex;flex-direction:column;gap:8px}
@media (max-width:820px){.composer{bottom:calc(70px + env(safe-area-inset-bottom,0px))}}
.composer-box{display:flex;gap:8px;align-items:flex-end;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:8px}
.composer-box textarea{border:0;min-height:44px;max-height:200px;padding:8px;background:transparent}
.composer-box textarea:focus{outline:0}
.prompt-cats{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:thin}
.prompt-cats .pill{flex:none}
.prompts{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,240px),1fr))}
.prompt{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:11px 13px;cursor:pointer;font-size:.9rem;line-height:1.4}
.prompt:hover{border-color:var(--accent)}
.prompt b{display:block;font-size:.92rem;margin-bottom:2px}
.attach{display:flex;gap:6px;flex-wrap:wrap}
.thumb{position:relative;width:54px;height:54px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
.thumb img{width:100%;height:100%;object-fit:cover}
.thumb button{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff;font-size:12px;line-height:1;cursor:pointer}

/* flashcards */
.flash{perspective:1200px;min-height:230px;cursor:pointer}
.flash-in{position:relative;min-height:230px;transition:transform .45s ease;transform-style:preserve-3d}
.flash.flip .flash-in{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;background:var(--surface);border:1px solid var(--line);border-radius:18px;padding:26px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;font-size:1.15rem;overflow:auto;overflow-wrap:anywhere}
.face.back{transform:rotateY(180deg);background:var(--surface2)}
@media (prefers-reduced-motion:reduce){.flash-in{transition:none}}
.boxes{display:flex;gap:4px}
.boxes i{width:16px;height:6px;border-radius:3px;background:var(--line)}
.boxes i.on{background:var(--accent)}

/* files */
.drop{border:2px dashed var(--line);border-radius:var(--r);padding:26px;text-align:center;display:flex;flex-direction:column;gap:8px;align-items:center;background:var(--surface)}
.drop.over{border-color:var(--accent);background:var(--soft)}
.ficon{width:42px;height:42px;border-radius:10px;background:var(--surface2);display:grid;place-items:center;font-size:.7rem;font-weight:700;color:var(--muted);flex:none;overflow:hidden;text-transform:uppercase}
.ficon img{width:100%;height:100%;object-fit:cover}

/* toolkit */
.ref-table{width:100%;border-collapse:collapse;font-size:.92rem}
.ref-table th,.ref-table td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);vertical-align:top}
.ref-table td:nth-child(2){font-variant-numeric:tabular-nums;white-space:nowrap}
.calc-out{font-family:var(--display);font-size:1.5rem;font-weight:600;font-variant-numeric:tabular-nums}
details.card>summary{cursor:pointer;font-family:var(--display);font-weight:600;font-size:1.05rem;list-style:none;display:flex;justify-content:space-between;align-items:center}
details.card>summary::after{content:"+";font-size:1.3rem;color:var(--muted)}
details.card[open]>summary::after{content:"–"}

/* focus timer */
.ring{width:220px;height:220px;max-width:100%;margin:0 auto;position:relative}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .time{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--display);font-size:2.6rem;font-weight:600;font-variant-numeric:tabular-nums}
.bars{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px}
.bar{display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end}
.bar i{width:100%;max-width:34px;border-radius:6px 6px 2px 2px;background:var(--accent);min-height:3px}
.bar.today i{background:var(--fg)}
.bar span{font-size:.72rem;color:var(--muted);font-variant-numeric:tabular-nums}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:999px;font-weight:600;font-size:.9rem;z-index:60;max-width:calc(100% - 32px)}
@media (max-width:820px){.toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);border-top-color:var(--accent);animation:sp 1s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
.note-editor textarea{min-height:320px}
.inline-confirm{display:flex;gap:6px;align-items:center;font-size:.85rem}

/* exams */
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
fieldset.card{margin:0;min-width:0}
.mode-grid{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.mode{text-align:left;background:var(--surface2);border:1px solid var(--line);border-radius:12px;padding:14px;cursor:pointer;display:flex;flex-direction:column;gap:3px}
.mode:hover{border-color:var(--accent)}
.mode b{font-family:var(--display);font-size:1.02rem}
.exam-progress{position:sticky;top:0;z-index:5;background:var(--bg);padding:8px 0;display:flex;gap:12px;align-items:center}
.bar-track{flex:1;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar-track i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s}
.qnum{font-family:var(--display);font-weight:600;color:var(--accent)}
.qtext{font-weight:600;font-size:1.02rem}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--line);border-radius:12px;cursor:pointer;line-height:1.45}
label.opt:hover{border-color:var(--accent)}
.opt input{position:absolute;opacity:0;pointer-events:none}
.opt .ol{flex:none;width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:.8rem;color:var(--muted)}
.opt:has(input:checked){border-color:var(--accent);background:var(--soft)}
.opt:has(input:checked) .ol{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.opt:has(input:focus-visible){outline:2px solid var(--accent);outline-offset:2px}
.opt .tag{margin-left:auto;flex:none;font-size:.72rem;font-weight:700;text-transform:uppercase;letter-spacing:.04em}
.opt.is-key{border-color:var(--ok);background:color-mix(in srgb,var(--ok) 10%,transparent)}
.opt.is-key .ol{background:var(--ok);border-color:var(--ok);color:#fff} .opt.is-key .tag{color:var(--ok)}
.opt.is-wrong{border-color:var(--bad);background:color-mix(in srgb,var(--bad) 9%,transparent)}
.opt.is-wrong .ol{border-color:var(--bad);color:var(--bad)} .opt.is-wrong .tag{color:var(--bad)}
.q.review{border-left:4px solid var(--line)}
.q.review.right{border-left-color:var(--ok)} .q.review.part{border-left-color:var(--warn)} .q.review.wrong{border-left-color:var(--bad)}
.verdict{font-size:.8rem;font-weight:700;color:var(--muted)}
.right .verdict{color:var(--ok)} .part .verdict{color:var(--warn)} .wrong .verdict{color:var(--bad)}
.key,.yours{padding:10px 12px;border-radius:10px;background:var(--surface2);display:flex;flex-direction:column;gap:4px}
.key{background:color-mix(in srgb,var(--ok) 9%,var(--surface))}
.yours p{white-space:pre-wrap;overflow-wrap:anywhere}
.submit-bar{position:sticky;bottom:12px;box-shadow:var(--shadow)}
@media (max-width:820px){.submit-bar{bottom:calc(80px + env(safe-area-inset-bottom,0px))}}
.case{padding:14px 16px;border-radius:var(--r);background:var(--soft);display:flex;flex-direction:column;gap:6px;border-left:4px solid var(--accent)}
.case p{line-height:1.55}
.opt.multi .ol{border-radius:7px}
.opt.multi:has(input:checked) .ol::after{content:"✓";position:absolute}
.opt.multi:has(input:checked) .ol{color:transparent;position:relative}
.opt.multi:has(input:checked) .ol::after{color:var(--accent-ink)}
.cheat{gap:16px}

<script>
(() => {
"use strict";
/* ---------- icons ---------- */
const I = {
  today:'<svg viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>',
  assistant:'<svg viewBox="0 0 24 24"><path d="M12 3l1.8 4.7L18.5 9.5l-4.7 1.8L12 16l-1.8-4.7L5.5 9.5l4.7-1.8z"/><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"/></svg>',
  cards:'<svg viewBox="0 0 24 24"><rect x="3" y="6" width="14" height="14" rx="2"/><path d="M7 3h12a2 2 0 0 1 2 2v12"/></svg>',
  files:'<svg viewBox="0 0 24 24"><path d="M7 18a4.5 4.5 0 0 1-.5-9A6 6 0 0 1 18 8a4 4 0 0 1 0 8"/><path d="M12 12v9m-3-6 3-3 3 3"/></svg>',
  planner:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  notes:'<svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5M9 13h7M9 17h5"/></svg>',
  toolkit:'<svg viewBox="0 0 24 24"><path d="M9 3h6v6h6v6h-6v6H9v-6H3V9h6z"/></svg>',
  focus:'<svg viewBox="0 0 24 24"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2.5 2M9 2h6"/></svg>',
  more:'<svg viewBox="0 0 24 24"><circle cx="5" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="19" cy="12" r="1.3"/></svg>',
  send:'<svg viewBox="0 0 24 24"><path d="M5 12h13M13 6l6 6-6 6"/></svg>',
  image:'<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  trash:'<svg viewBox="0 0 24 24"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg>',
  plus:'<svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>',
  copy:'<svg viewBox="0 0 24 24"><rect x="8" y="8" width="12" height="12" rx="2"/><path d="M16 8V5a1 1 0 0 0-1-1H5a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h3"/></svg>',
  save:'<svg viewBox="0 0 24 24"><path d="M5 3h11l3 3v15H5z"/><path d="M8 3v5h7M8 21v-7h8v7"/></svg>',
  exams:'<svg viewBox="0 0 24 24"><path d="M9 4h6v3H9z"/><path d="M15 5h3a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H6a1 1 0 0 1-1-1V6a1 1 0 0 1 1-1h3"/><path d="m9 13 2 2 4-4"/></svg>',
  open:'<svg viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',
};
const ROUTES = [
  ['today','Today'],['assistant','AI Assistant'],['cards','Flashcards'],['exams','Exams'],['files','My Files'],
  ['planner','Planner'],['notes','Notes'],['toolkit','Clinical Toolkit'],['focus','Focus Timer']
];
const TABS = ['today','assistant','cards','exams'];
const PALETTES = [['pink','Blush pink','#E7A3BE'],['navy','Navy','#2A5592'],['forest','Forest','#2E6747'],['charcoal','Charcoal','#3C4654']];

/* ---------- helpers ---------- */
const $ = (s, r=document) => r.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const todayISO = () => { const d=new Date(); d.setMinutes(d.getMinutes()-d.getTimezoneOffset()); return d.toISOString().slice(0,10); };
const addDays = (iso, n) => { const d=new Date(iso+'T12:00:00'); d.setDate(d.getDate()+n); return d.toISOString().slice(0,10); };
const daysUntil = iso => Math.round((new Date(iso+'T12:00:00') - new Date(todayISO()+'T12:00:00'))/864e5);
const fmtDate = iso => new Date(iso+'T12:00:00').toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const rid = p => p + '-' + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
const fmtSize = b => b>1e6 ? (b/1e6).toFixed(1)+' MB' : Math.max(1,Math.round(b/1e3))+' KB';
const lsGet = (k, d) => { try { const v = localStorage.getItem(k); return v==null ? d : JSON.parse(v); } catch { return d; } };
const lsSet = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };
let toastT;
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2600); }
async function copyText(text){ try{ await navigator.clipboard.writeText(text); toast('Copied'); }catch{ toast('Copy blocked here. Select the text and copy it instead.'); } }

/* ---------- theme ---------- */
function setPalette(p){ document.documentElement.dataset.palette = p; lsSet('nss-palette', p); renderSwatches(); }
function renderSwatches(){
  const cur = document.documentElement.dataset.palette || 'pink';
  const html = PALETTES.map(([k,n,c]) => `<button class="sw" style="background:${c}" data-pal="${k}" aria-pressed="${k===cur}" title="${n}" aria-label="${n} theme"></button>`).join('');
  document.querySelectorAll('.swatches').forEach(el => el.innerHTML = html);
}
document.documentElement.dataset.palette = lsGet('nss-palette','pink');

/* ---------- store (cloud db, local fallback) ---------- */
const S = { items:new Map(), mode:'loading', col:null, db:null, assets:null, sample:null };
const LKEY = 'nss-local-items';
function useLocal(){
  if (S.mode === 'cloud') return;
  S.mode = 'local';
  S.items = new Map(Object.entries(lsGet(LKEY, {})));
  render();
}
function persistLocal(){ if (S.mode==='local') lsSet(LKEY, Object.fromEntries(S.items)); }
const all = kind => [...S.items.values()].filter(x => x.kind === kind);
function put(item){
  item.id = item.id || rid(item.kind);
  const { id, ...data } = item;
  S.items.set(id, item); persistLocal(); render();
  if (S.mode==='cloud') S.col.doc(id).set(data).catch(e => toast('Could not save: ' + (e?.message || 'try again')));
  return item;
}
function patch(id, fields){ const it=S.items.get(id); if(!it) return; Object.assign(it, fields); put(it); }
function remove(id){
  S.items.delete(id); persistLocal(); render();
  if (S.mode==='cloud') S.col.doc(id).delete().catch(()=>toast('Could not delete. Try again.'));
}
async function initStore(){
  if (!window.claude?.use){ useLocal(); return; }
  const timer = setTimeout(useLocal, 10000);
  const [db, user, assets, sample] = await Promise.all(['db','user','assets','sample'].map(n => window.claude.use(n).catch(()=>null)));
  S.assets = assets; S.sample = sample;
  let uid = null;
  try { uid = user ? await user.id() : null; } catch {}
  if (!db || !uid){ clearTimeout(timer); useLocal(); return; }
  S.db = db; S.col = db.collection('data/users/' + uid);
  S.col.onSnapshot(snap => {
    clearTimeout(timer);
    S.mode = 'cloud';
    S.items = new Map(snap.docs.map(d => [d.id, { id:d.id, ...d.data() }]));
    render();
  }, () => { clearTimeout(timer); useLocal(); });
  render();
}

/* ---------- routing / shell ---------- */
let route = 'today';
function readHash(){ const h=location.hash.slice(1); route = ROUTES.some(r=>r[0]===h) ? h : 'today'; }
function renderShell(){
  $('#nav-side').innerHTML = ROUTES.map(([k,n]) => `<a href="#${k}" ${k===route?'aria-current="page"':''}>${I[k]}<span>${n}</span></a>`).join('');
  const short = {today:'Today',assistant:'Ask AI',cards:'Cards',exams:'Exams'};
  const inMore = !TABS.includes(route);
  $('#tabbar').innerHTML = TABS.map(k => `<a href="#${k}" ${k===route?'aria-current="page"':''}>${I[k]}<span>${short[k]}</span></a>`).join('')
    + `<button type="button" data-act="more" ${inMore?'aria-current="page"':''}>${I.more}<span>More</span></button>`;
  const sync = S.mode==='cloud' ? 'Synced to your account' : S.mode==='local' ? 'Saved on this device only' : 'Connecting…';
  $('#sync-side').textContent = sync;
  renderSwatches();
}
function openMore(){
  const sh = $('#sheet');
  sh.innerHTML = `<div class="sheet-bg" data-act="close-sheet"></div><div class="sheet" role="dialog" aria-label="More">
    <nav class="nav">${ROUTES.filter(r=>!TABS.includes(r[0])).map(([k,n]) => `<a href="#${k}" data-act="close-sheet">${I[k]}<span>${n}</span></a>`).join('')}</nav>
    <div class="stack"><span class="label">Colour theme</span><div class="swatches"></div>
    <span class="tiny muted">${S.mode==='cloud'?'Synced to your account':'Saved on this device only'}</span></div></div>`;
  sh.hidden = false; renderSwatches();
}

/* ---------- views ---------- */
const V = {};
let viewState = {};

function courseOptions(sel){
  const cs = all('course').sort((a,b)=>a.name.localeCompare(b.name));
  return `<option value="">No course</option>` + cs.map(c => `<option value="${esc(c.name)}" ${c.name===sel?'selected':''}>${esc(c.name)}</option>`).join('');
}
function weekMinutes(){
  const logs = all('log'); const days=[];
  for (let i=6;i>=0;i--){ const d=addDays(todayISO(),-i); days.push({d, m: logs.filter(l=>l.date===d).reduce((s,l)=>s+(l.minutes||0),0)}); }
  return days;
}
function dueCards(){ const t=todayISO(); return all('card').filter(c => !c.next || c.next <= t); }

function seedExamples(){
  const t = todayISO();
  const ex = [
    {kind:'course',name:'Pathophysiology'},{kind:'course',name:'Pharmacology'},{kind:'course',name:'Health Assessment'},{kind:'course',name:'Clinical Placement'},
    {kind:'task',title:'Example: Pharm quiz — antihypertensives',type:'exam',due:addDays(t,9),course:'Pharmacology',done:false},
    {kind:'task',title:'Example: Care plan draft due',type:'assignment',due:addDays(t,3),course:'Clinical Placement',done:false},
    {kind:'task',title:'Example: Clinical shift 07:00',type:'clinical',due:addDays(t,1),course:'Clinical Placement',done:false},
    {kind:'task',title:'Example: Read chapter on fluid & electrolytes',type:'reading',due:t,course:'Pathophysiology',done:false},
    {kind:'card',deck:'Pharmacology',front:'Example: What does the suffix "-olol" indicate?',back:'Beta blocker (e.g. metoprolol). Check apical pulse and BP before giving; hold if HR is low per order.',box:1,next:t},
    {kind:'card',deck:'Pathophysiology',front:'Example: Normal adult serum potassium (K⁺)?',back:'3.5–5.0 mmol/L',box:1,next:t},
    {kind:'card',deck:'Health Assessment',front:'Example: What does SBAR stand for?',back:'Situation, Background, Assessment, Recommendation',box:1,next:t},
    {kind:'note',title:'Example: Heart failure — key points',course:'Pathophysiology',body:'Left-sided: pulmonary congestion → crackles, dyspnea, orthopnea.\nRight-sided: systemic congestion → JVD, peripheral edema, weight gain.\nMonitor daily weights (same time, same scale).',updated:Date.now()},
  ];
  ex.forEach(x => put({...x}));
  toast('Examples added. Delete them any time.');
}

V.today = () => {
  const t = todayISO();
  const tasks = all('task').filter(x=>!x.done).sort((a,b)=>(a.due||'9').localeCompare(b.due||'9'));
  const soon = tasks.filter(x => x.due && daysUntil(x.due) <= 7);
  const exam = tasks.filter(x => x.type==='exam' && x.due && daysUntil(x.due)>=0)[0];
  const wk = weekMinutes(); const wkTotal = wk.reduce((s,d)=>s+d.m,0);
  const due = dueCards().length;
  const hr = new Date().getHours();
  const hello = hr<12 ? 'Good morning' : hr<18 ? 'Good afternoon' : 'Good evening';
  const isEmpty = S.items.size === 0 && S.mode !== 'loading';
  return `
  <div class="head"><div><h1>${hello}</h1><p class="muted">${fmtDate(t)} · one thing at a time.</p></div>
    <a class="btn primary" href="#focus">${I.focus} Start a focus session</a></div>
  ${isEmpty ? `<div class="banner"><span>Your space is empty. Add a course in Planner, or load a few examples to see how it works.</span><button class="btn sm" data-act="seed">Load examples</button></div>` : ''}
  <div class="grid">
    <div class="card"><span class="label">Next exam</span>
      ${exam ? `<div class="row"><span class="stat">${daysUntil(exam.due)===0?'Today':daysUntil(exam.due)+' days'}</span></div><p class="t">${esc(exam.title)}</p><p class="small muted">${fmtDate(exam.due)}${exam.course?' · '+esc(exam.course):''}</p>
        <button class="btn sm" data-act="plan-exam" data-id="${exam.id}">${I.assistant} Make me a study plan</button>`
      : `<p class="muted small">No exams on the calendar. Add one in <a href="#planner">Planner</a> and the countdown shows here.</p>`}
    </div>
    <div class="card"><span class="label">Flashcards due</span><span class="stat">${due}</span>
      <p class="small muted">${due ? 'A few minutes of review keeps them fresh.' : 'All caught up.'}</p>
      <a class="btn sm" href="#cards">${due?'Review now':'Open flashcards'}</a></div>
    <div class="card"><span class="label">Studied this week</span><span class="stat">${(wkTotal/60).toFixed(1)} h</span>
      <div class="bars" style="height:60px">${barHTML(wk, true)}</div></div>
  </div>
  <div class="grid-2">
    <div class="card"><div class="row between"><h2>Due in the next 7 days</h2><a class="btn sm ghost" href="#planner">All tasks</a></div>
      ${soon.length ? `<div class="list">${soon.map(taskRow).join('')}</div>` : `<div class="empty small">Nothing due this week. Add assignments, exams and clinical shifts in Planner.</div>`}
    </div>
    <div class="card"><h2>Ask the study assistant</h2>
      <textarea id="quick-ask" rows="3" placeholder="e.g. Explain how furosemide affects potassium"></textarea>
      <div class="row"><button class="btn primary" data-act="quick-ask">${I.send} Ask</button><a class="btn ghost sm" href="#assistant">Browse suggested prompts</a></div>
      <p class="tiny muted">Never type patient names or identifying details.</p>
    </div>
  </div>`;
};
function barHTML(wk, compact){
  const max = Math.max(60, ...wk.map(d=>d.m));
  return wk.map(d => `<div class="bar ${d.d===todayISO()?'today':''}" title="${d.m} min on ${fmtDate(d.d)}"><i style="height:${Math.max(3,d.m/max*100)}%"></i>${compact?'':`<span>${d.m?Math.round(d.m):''}</span>`}<span>${new Date(d.d+'T12:00').toLocaleDateString(undefined,{weekday:'narrow'})}</span></div>`).join('');
}
function taskRow(x){
  const dd = x.due ? daysUntil(x.due) : null;
  const when = dd==null ? '' : dd<0 ? `<span class="tiny" style="color:var(--bad)">${-dd}d overdue</span>` : dd===0 ? '<span class="tiny">Today</span>' : dd===1 ? '<span class="tiny">Tomorrow</span>' : `<span class="tiny muted">${fmtDate(x.due)}</span>`;
  return `<div class="li ${x.done?'done':''}"><button class="check" role="checkbox" aria-checked="${!!x.done}" aria-label="Mark done" data-act="toggle-task" data-id="${x.id}"></button>
    <div class="grow"><div class="t">${esc(x.title)}</div><div class="row" style="gap:6px;margin-top:3px"><span class="chip ${esc(x.type)}">${esc(x.type||'task')}</span>${x.course?`<span class="tiny muted">${esc(x.course)}</span>`:''}${when}</div></div>
    <button class="iconbtn" aria-label="Delete" data-act="del" data-id="${x.id}">${I.trash}</button></div>`;
}

/* ----- assistant ----- */
const PROMPTS = {
  'Pathophysiology':[
    ['Explain a condition','Explain the pathophysiology of [condition] step by step, from cause to signs and symptoms, at a nursing-student level. End with the top 3 nursing priorities.'],
    ['Compare two conditions','Compare [condition A] and [condition B] in a table: cause, signs and symptoms, key labs, and nursing priorities.'],
    ['Concept map outline','Build a concept map outline for a patient with [condition]: risk factors, pathophysiology, assessment findings, diagnostics, nursing interventions, and patient teaching.'],
    ['Explain it simply','Explain [topic] like I\'m new to it, then again at exam level, then give me one analogy that will help me remember it.'],
  ],
  'Pharmacology':[
    ['Drug card','Make a drug card for [drug]: class, mechanism of action, indications, usual adult dose range, key side effects, contraindications, nursing assessments before giving, and patient teaching. Use Canadian brand names.'],
    ['Drug class overview','Summarize the [drug class] class: how it works, common suffix, examples, major side effects, and what to monitor.'],
    ['Quiz me on a class','Quiz me on [drug class] with 5 questions, one at a time. Wait for my answer before giving feedback and the next question.'],
    ['Memory tricks','Give me memory tricks for the [drug class] suffixes and their main adverse effects.'],
  ],
  'Dosage math':[
    ['Practice set','Give me 5 dosage calculation problems (oral tablets, liquid, IV mL/h, IV drops/min, weight-based mg/kg). Show only the questions; reveal answers and working after I reply.'],
    ['Check my work','Check my dosage calculation step by step and tell me exactly where I went wrong, if anywhere: [paste problem and my answer]'],
    ['Explain a formula','Explain how to calculate [IV drip rate / weight-based dose / reconstitution] with a worked example in SI units.'],
  ],
  'Care plans & clinical':[
    ['Nursing care plan','Help me build a nursing care plan for a patient with [medical diagnosis]: assessment data, 2–3 nursing diagnoses, SMART goals, interventions with rationales, and evaluation criteria.'],
    ['SBAR handoff','Turn these de-identified clinical notes into a clear SBAR handoff: [notes]'],
    ['Placement prep','I start a placement on a [unit type, e.g. cardiology] unit. What conditions, medications, assessments and skills should I review before my first shift?'],
    ['Interpret findings','For a [age]-year-old patient with [condition], these are the vitals and labs: [values]. Which are abnormal, what might they mean, and what would I report to the nurse or physician?'],
    ['Head-to-toe checklist','Give me a head-to-toe assessment checklist I can memorize, in order, with normal findings for each system.'],
  ],
  'Exam prep':[
    ['NCLEX-style questions','Write 5 NCLEX-style questions on [topic], including at least one select-all-that-apply. Give rationales for every option after I answer.'],
    ['Prioritization','Teach me the prioritization frameworks (ABCs, Maslow, acute vs chronic, stable vs unstable) with 3 practice "who do you see first?" questions.'],
    ['Study plan','Make a day-by-day study plan for my [course] exam on [date]. I can study [hours] per day. Topics: [list topics].'],
    ['OIIQ exam prep','Explain how the OIIQ professional exam for Quebec nurses is usually structured and give me a study approach for clinical-judgment questions. Tell me to confirm current details on the OIIQ website.'],
    ['Summarize my notes','Summarize these notes into a one-page exam review with key terms in bold: [paste notes]'],
  ],
  'Français clinique':[
    ['Clinical phrases','Give me 20 French phrases for [situation, e.g. pain assessment] as used in Québec hospitals, with English translations and pronunciation tips.'],
    ['Role-play admission','Role-play a French-speaking patient being admitted to my unit. Speak only French, keep it simple, and correct my French gently after each reply.'],
    ['Translate teaching','Translate this patient teaching into simple, plain Québec French: [text]'],
    ['Vocabulary quiz','Quiz me on 10 French medical vocabulary words for [body system], one at a time.'],
  ],
  'Writing & research':[
    ['Reflective journal','Help me outline a reflective journal entry using Gibbs\' reflective cycle about this clinical experience: [describe, without identifying details]'],
    ['APA 7 help','Show me how to format an APA 7 reference and in-text citation for [journal article / website / textbook], with an example.'],
    ['Improve my paragraph','Give me feedback on clarity, structure and evidence in this paragraph. Do not rewrite it for me; point out what to fix: [paragraph]'],
    ['Find evidence','What search terms and databases (e.g. CINAHL, PubMed) should I use to find evidence on [topic]? Suggest MeSH terms.'],
  ],
  'Wellbeing':[
    ['Triage my week','I have these deadlines and shifts this week: [list]. I feel overwhelmed. Help me triage what to do first and what can wait.'],
    ['After a hard shift','I had a hard clinical shift. Help me debrief it in a healthy way with a few guided questions.'],
    ['Sleep around shifts','Give me practical tips for sleep and meals around early 07:00 clinical shifts.'],
  ],
};
const SYSTEM = `You are a friendly, precise study assistant for a nursing student at McGill University's Ingram School of Nursing in Montreal, Quebec, Canada.
Teach clearly and accurately at a university nursing level. Use Canadian context: SI units (mmol/L, µmol/L, °C), Canadian drug names, Quebec practice (OIIQ) and NCLEX-RN style when relevant. Use short headings, bullets and tables where they help. When quizzing, ask one question at a time and wait.
This is for studying, not real patient care: remind the student to follow their course materials, clinical instructor and agency protocols when it matters. If the student shares anything that could identify a real patient, ask them to remove it.`;
viewState.chat = [];
viewState.cat = 'Pathophysiology';
viewState.images = [];
let chatAbort = null;

V.assistant = () => {
  const cats = Object.keys(PROMPTS);
  const noAI = S.mode!=='loading' && !S.sample;
  return `
  <div class="head"><div><h1>AI Study Assistant</h1><p class="muted">Pick a suggested prompt, fill in the [brackets], or ask anything.</p></div>
    ${viewState.chat.length ? `<button class="btn sm" data-act="new-chat">New chat</button>`:''}</div>
  ${noAI ? `<div class="banner">The assistant works when this page is opened on claude.ai while signed in.</div>`:''}
  ${viewState.chat.length===0 ? `

      <textarea id="ask" rows="1" placeholder="Ask about a condition, drug, calculation…">${esc(viewState.draft||'')}</textarea>

function msgHTML(m, i){
  if (m.role==='user') return `<div class="msg u">${esc(m.content)}${m.imgs?`<div class="tiny muted">📎 ${m.imgs} image${m.imgs>1?'s':''}</div>`:''}</div>`;
  return `<div class="msg a" data-i="${i}">${m.content ? md(m.content) : '<span class="spin"></span> <span class="muted small">Thinking…</span>'}
    ${m.done ? `<div class="row" style="margin-top:8px"><button class="btn sm ghost" data-act="copy-msg" data-i="${i}">${I.copy} Copy</button><button class="btn sm ghost" data-act="save-msg" data-i="${i}">${I.save} Save to notes</button><button class="btn sm ghost" data-act="cards-msg" data-i="${i}">${I.cards} Make flashcards</button></div>`:''}</div>`;
}
function md(src){
  const lines = esc(src).split('\n'); let out=''; let list=null; let table=[];
  const inline = s => s.replace(/`([^`]+)`/g,'<code>$1</code>').replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>').replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  const closeList = () => { if(list){ out += `</${list}>`; list=null; } };
  const flushTable = () => { if(!table.length) return; const rows=table.filter(r=>!/^\s*\|?\s*:?-{2,}/.test(r)); out += '<div class="tbl"><table>' + rows.map((r,i)=>'<tr>'+r.replace(/^\s*\||\|\s*$/g,'').split('|').map(c=>i===0?`<th>${inline(c.trim())}</th>`:`<td>${inline(c.trim())}</td>`).join('')+'</tr>').join('') + '</table></div>'; table=[]; };
  for (const raw of lines){
    const l = raw.trimEnd();
    if (/^\s*\|.*\|\s*$/.test(l)){ closeList(); table.push(l); continue; } else flushTable();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))){ closeList(); out += `<h3>${inline(m[2])}</h3>`; }
    else if ((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){ closeList(); out+='<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if ((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ closeList(); out+='<ol>'; list='ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if (!l.trim()){ closeList(); }
    else { closeList(); out += `<p>${inline(l)}</p>`; }
  }
  closeList(); flushTable(); return out;
}
async function sendChat(text){
  text = (text||'').trim();
  if (!text || chatAbort) return;
  if (!S.sample){ toast('The assistant needs claude.ai while signed in.'); return; }
  const imgs = viewState.images.map(x=>x.blob);
  viewState.chat.push({role:'user', content:text, imgs: imgs.length||0});
  viewState.images = []; viewState.draft = '';
  const a = {role:'assistant', content:'', done:false}; viewState.chat.push(a);
  chatAbort = new AbortController(); render(); scrollChat();
  const msgs = viewState.chat.filter(m=>m!==a).map((m,i)=>({role:m.role, content: i===0 ? SYSTEM+'\n\n---\n\nStudent: '+m.content : m.content}));
  try{
    const opts = { signal: chatAbort.signal, cache:false, onText: ({text}) => { a.content = text; updateLastMsg(a); } };
    if (imgs.length) opts.images = imgs;
    const r = await S.sample(msgs, opts);
    a.content = r.text;
  }catch(e){
    a.content = (e?.text ? e.text + '\n\n' : '') + (e?.code==='not_granted' ? '_The assistant was not allowed. You can turn it on from this page\'s Permissions menu._' : e?.code==='rate_limited' ? '_Too many requests right now. Wait a minute and try again._' : e?.code==='cancelled' ? '_Stopped._' : '_Something went wrong. Try again._');
  }
  a.done = true; chatAbort = null; render(); scrollChat();
}
function updateLastMsg(a){
  const el = document.querySelector(`.msg.a[data-i="${viewState.chat.indexOf(a)}"]`);
  if (el) el.innerHTML = md(a.content);
}
function scrollChat(){ const c=$('#chat'); if(c && c.lastElementChild) c.lastElementChild.scrollIntoView({block:'end', behavior:'smooth'}); }

const examById = id => EXAMS.find(x=>x.id===id);
const isRight = (q,a) => q.k ? Array.isArray(a) && a.length===q.k && a.every(x=>x<q.k) : a===0;
const isKey = (q,o) => q.k ? o<q.k : o===0;
const hasAns = (r,i) => r.mode==='mc' ? (Array.isArray(r.ans[i]) ? r.ans[i].length>0 : r.ans[i]!=null) : !!(r.ans[i]||'').trim();
const picked = (a,o) => Array.isArray(a) ? a.includes(o) : a===o;
const LET = 'ABCDEFGH';
function caseHead(ex, q, prev){ if(!q.c || (prev && prev.c===q.c)) return ''; const cs=ex.cases[q.c]; return `<div class="case"><span class="label">${esc(cs.title)}</span><p>${esc(cs.text)}</p></div>`; }
const EXAM_KEY = 'nss-exam-draft';
const shuffle = a => { a=a.slice(); for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; };
function examStart(id, mode, only){
  const ex = examById(id);
  const idx = only && only.length ? only : ex.qs.map((_,i)=>i);
  const run = {id, mode, idx, ord:{}, ans:{}, start:Date.now(), submitted:false, marks:{}, ai:{}};
  idx.forEach(i => run.ord[i] = shuffle(ex.qs[i].o.map((_,k)=>k)));
  viewState.exam = run; lsSet(EXAM_KEY, run); render(); window.scrollTo(0,0);
}
function examAnswered(r){ return r.idx.filter(i => hasAns(r,i)).length; }
function examScore(r){
  const ex = examById(r.id);
  if (r.mode==='mc') return r.idx.reduce((s,i)=>s+(isRight(ex.qs[i],r.ans[i])?1:0),0);
  return r.idx.reduce((s,i)=>s+(r.marks[i]??0),0);
}
function examMissed(r){ const ex=examById(r.id); return r.idx.filter(i => r.mode==='mc' ? !isRight(ex.qs[i],r.ans[i]) : (r.marks[i]??0) < 1); }
function examSave(){
  const r = viewState.exam, ex = examById(r.id);
  const score = examScore(r), total = r.idx.length;
  const it = put({id:r.attemptId, kind:'attempt', exam:r.id, title:ex.title, mode:r.mode, score, total, pct:Math.round(score/total*100), missed:examMissed(r), mins:Math.max(1,Math.round((Date.now()-r.start)/60000)), date:todayISO(), at:r.attemptAt||(r.attemptAt=Date.now())});
  r.attemptId = it.id;
}

function examResults(r){

async function examAiMark(){

function calcBody(k){
  const n = (id,l,ph) => `<label class="f">${l}<input type="number" step="any" inputmode="decimal" id="${id}" placeholder="${ph}" data-calc="${k}"></label>`;
  const f = {
    dhq: `<div class="form-row">${n('c1','Desired dose','e.g. 500 mg')}${n('c2','Have (on hand)','e.g. 250 mg')}${n('c3','Quantity','e.g. 1 tab or 5 mL')}</div><p class="small muted">Dose = (Desired ÷ Have) × Quantity</p>`,
    ivrate: `<div class="form-row">${n('c1','Volume (mL)','e.g. 1000')}${n('c2','Time (hours)','e.g. 8')}</div><p class="small muted">Rate = Volume ÷ Time</p>`,
    drops: `<div class="form-row">${n('c1','Volume (mL)','e.g. 500')}${n('c2','Time (minutes)','e.g. 240')}${n('c3','Drop factor (gtt/mL)','10, 15, 20 or 60')}</div><p class="small muted">gtt/min = (Volume × Drop factor) ÷ Time in minutes</p>`,
    weight: `<div class="form-row">${n('c1','Dose (mg/kg)','e.g. 15')}${n('c2','Weight (kg)','e.g. 22')}${n('c3','Doses per day (optional)','e.g. 4')}</div><p class="small muted">Dose = mg/kg × kg</p>`,
  }[k];
  return f + `<div class="calc-out" id="calc-out" aria-live="polite">—</div>`;
}
function runCalc(k){
  const v = id => parseFloat($('#'+id)?.value);
  const a=v('c1'), b=v('c2'), c=v('c3'); let out='—';
  const r = x => Number.isFinite(x) ? (Math.round(x*100)/100).toString() : null;
  if (k==='dhq' && a&&b&&c) out = r(a/b*c) + ' (same unit as quantity)';
  if (k==='ivrate' && a&&b) out = r(a/b) + ' mL/h';
  if (k==='drops' && a&&b&&c) out = Math.round(a*c/b) + ' gtt/min';
  if (k==='weight' && a&&b) out = r(a*b) + ' mg per dose' + (c ? ` · ${r(a*b*c)} mg/day` : '');
  $('#calc-out').textContent = out;
}

const mmss = s => `${String(Math.floor(s/60)).padStart(2,'0')}:${String(s%60).padStart(2,'0')}`;
function tick(){
  T.left = Math.max(0, T.len - Math.round((Date.now()-T.start)/1000));
  const el=$('#t-time'); if(el) el.textContent = mmss(T.left);
  const arc=$('#ring-arc'); if(arc){ const C=2*Math.PI*96; arc.setAttribute('stroke-dashoffset', C*(1-T.left/T.len)); }
  document.title = T.running ? `${mmss(T.left)} · Nursing Study Space` : 'Nursing Study Space';
  if (T.left===0){
    clearInterval(T.iv); T.running=false; document.title='Nursing Study Space';

    else toast('Break over. Ready for another block?');
    T.left=T.len; render();
  }
}
function setMode(m){ clearInterval(T.iv); T.running=false; T.mode=m; T.len={focus:25,long:50,break:5}[m]*60; T.left=T.len; render(); }

function render(){

/* ---------- events ---------- */
document.addEventListener('click', async e => {
  const t = e.target.closest('[data-act],[data-pal]'); if(!t) return;
  if (t.dataset.pal){ setPalette(t.dataset.pal); return; }
  const act = t.dataset.act, id = t.dataset.id;
  switch(act){
    case 'more': openMore(); break;
    case 'close-sheet': $('#sheet').hidden = true; break;
    case 'seed': seedExamples(); break;
    case 'toggle-task': { const it=S.items.get(id); patch(id,{done:!it.done}); break; }
    case 'del': remove(id); break;
    case 'confirm': viewState.confirm=id; render(); break;
    case 'cancel': viewState.confirm=null; render(); break;
    case 'quick-ask': { const q=$('#quick-ask').value; if(!q.trim()) return; location.hash='assistant'; setTimeout(()=>sendChat(q),0); break; }
    case 'plan-exam': { const x=S.items.get(id); location.hash='assistant'; setTimeout(()=>sendChat(`Make a day-by-day study plan for my exam "${x.title}"${x.course?' ('+x.course+')':''} on ${fmtDate(x.due)}. Today is ${fmtDate(todayISO())}. Ask me what topics it covers and how many hours a day I have before you finalize it.`),0); break; }
    case 'cat': viewState.cat=t.dataset.cat; render(); break;
    case 'use-prompt': case 'go-prompt': {
      const cat = t.dataset.cat || viewState.cat; const p = PROMPTS[cat][+t.dataset.i][1];
      viewState.draft = p; if(location.hash!=='#assistant') location.hash='assistant'; else render();
      setTimeout(()=>{ const a=$('#ask'); if(!a) return; a.value=p; autoGrow(); a.focus(); const s=p.indexOf('['); if(s>=0) a.setSelectionRange(s, p.indexOf(']',s)+1); },30); break; }
    case 'send': sendChat($('#ask').value); break;
    case 'new-chat': chatAbort?.abort(); viewState.chat=[]; render(); break;
    case 'pick-img': $('#img-pick').click(); break;
    case 'rm-img': viewState.images.splice(+t.dataset.i,1); render(); break;
    case 'copy-msg': copyText(viewState.chat[+t.dataset.i].content); break;
    case 'save-msg': { const m=viewState.chat[+t.dataset.i]; const q=viewState.chat[+t.dataset.i-1]?.content||'AI answer'; put({kind:'note', title:q.slice(0,60), course:'', body:m.content, updated:Date.now()}); toast('Saved to Notes'); break; }
    case 'cards-msg': viewState.aiSrc = viewState.chat[+t.dataset.i].content; location.hash='cards'; setTimeout(()=>aiCards(viewState.aiSrc),30); break;
    case 'deck': viewState.deck=t.dataset.deck; render(); break;
    case 'start-study': { const d=viewState.deck; const q=dueCards().filter(c=>!d||(c.deck||'General')===d).map(c=>c.id).sort(()=>Math.random()-.5); viewState.study={queue:q,i:0,flip:false}; render(); break; }
    case 'flip': if(viewState.study){ viewState.study.flip=!viewState.study.flip; render(); } break;
    case 'grade': {
      const st=viewState.study, c=S.items.get(st.queue[st.i]); const g=+t.dataset.g;
      const box = g===0 ? 1 : g===1 ? Math.max(1,(c.box||1)) : Math.min(5,(c.box||1)+1);
      const gap = g===0 ? 1 : [1,3,7,14,30][box-1];
      patch(c.id,{box, next:addDays(todayISO(),gap)});
      st.i++; st.flip=false; if(st.i>=st.queue.length){ viewState.study=null; toast('Review done. Nice work.'); } render(); break; }
    case 'end-study': viewState.study=null; render(); break;
    case 'ai-cards': aiCards($('#ai-cards-src').value); break;
    case 'ai-cards-keep': viewState.aiCards.forEach(c=>put({kind:'card',deck:viewState.deck||'General',front:c.front,back:c.back,box:1,next:todayISO()})); viewState.aiCards=null; viewState.aiSrc=''; toast('Cards added'); break;
    case 'ai-cards-drop': viewState.aiCards=null; render(); break;
    case 'pick-files': viewState.upCourse=$('#up-course').value; $('#file-pick').click(); break;
    case 'del-file': { const f=S.items.get(id); viewState.confirm=null; try{ if(S.assets && f.assetId) await S.assets.delete(f.assetId); }catch{} remove(id); toast('File deleted'); break; }
    case 'ask-img': { const f=S.items.get(id); try{ const b=await (await fetch(f.url)).blob(); viewState.images=[{blob:b,url:f.url}]; viewState.draft='Explain what is on this slide and quiz me on it with 3 questions.'; location.hash='assistant'; render(); }catch{ toast('Could not load that image.'); } break; }
    case 'plan-filter': viewState.planFilter=t.dataset.f; render(); break;
    case 'new-note': { const n=put({kind:'note',title:'',course:'',body:'',updated:Date.now()}); viewState.noteId=n.id; render(); setTimeout(()=>$('#ne-title')?.focus(),0); break; }
    case 'open-note': e.preventDefault(); viewState.noteId=id; viewState.confirm=null; render(); break;
    case 'del-note': remove(id); viewState.noteId=null; viewState.confirm=null; render(); break;
    case 'note-ai': { const n=S.items.get(viewState.noteId); if(!n?.body?.trim()) { toast('Write something in the note first.'); return; } const ask = t.dataset.mode==='summary' ? `Summarize my notes into a one-page exam review with key terms in bold:\n\n${n.body}` : `Quiz me on these notes with 5 questions, one at a time. Wait for my answer each time:\n\n${n.body}`; viewState.chat=[]; location.hash='assistant'; setTimeout(()=>sendChat(ask),30); break; }
    case 'note-cards': { const n=S.items.get(viewState.noteId); if(!n?.body?.trim()) { toast('Write something in the note first.'); return; } viewState.deck=n.course||''; location.hash='cards'; setTimeout(()=>aiCards(n.body),30); break; }
    case 'calc': viewState.calc=t.dataset.c; render(); break;
    case 'labs-cards': LABS.forEach(([a,b])=>put({kind:'card',deck:'Lab values',front:`Normal adult ${a}?`,back:b,box:1,next:todayISO()})); toast(`${LABS.length} lab cards added to "Lab values"`); break;
    case 'exam-start': examStart(t.dataset.id, t.dataset.m); break;
    case 'exam-quit': viewState.exam=null; lsSet(EXAM_KEY,null); render(); toast('Exam closed. Nothing was saved.'); break;
    case 'exam-done': viewState.exam=null; lsSet(EXAM_KEY,null); render(); window.scrollTo(0,0); break;
    case 'exam-retry': { const a=S.items.get(id); if(a && examById(a.exam)) examStart(a.exam, a.mode, a.missed); break; }
    case 'exam-retry-now': { const r=viewState.exam; examStart(r.id, r.mode, examMissed(r)); break; }
    case 'exam-mark': { const r=viewState.exam, i=+t.dataset.q; r.marks[i]=+t.dataset.v; if(r.idx.every(k=>r.marks[k]!=null)) examSave(); lsSet(EXAM_KEY,r); render(); break; }
    case 'exam-ai': examAiMark(); break;
    case 'exam-cheat': viewState.cheat=t.dataset.id; viewState.cheatY=window.scrollY; render(); window.scrollTo(0,0); break;
    case 'cheat-close': { const y=viewState.cheatY||0; viewState.cheat=null; render(); window.scrollTo(0,y); break; }
    case 'exam-cards': { const r=viewState.exam, ex=examById(r.id); const miss=examMissed(r); miss.forEach(i=>put({kind:'card',deck:ex.course+' exam',front:ex.qs[i].q,back:ex.qs[i].a,box:1,next:todayISO()})); toast(`${miss.length} cards added to "${ex.course} exam"`); break; }
    case 'tmode': setMode(t.dataset.m); break;
    case 'tstart':
      if (T.running){ clearInterval(T.iv); T.running=false; T.len=T.left; }
      else { viewState.tCourse=$('#t-course')?.value||''; T.start=Date.now(); T.running=true; T.iv=setInterval(tick,500); }
      render(); break;
    case 'treset': setMode(T.mode); break;
  }
});
document.addEventListener('keydown', e => {
  if (e.target.id==='ask' && e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); sendChat(e.target.value); }
  if (e.target.closest?.('.flash') && (e.key===' '||e.key==='Enter')){ e.preventDefault(); viewState.study.flip=!viewState.study.flip; render(); }
  if (e.key==='Escape' && !$('#sheet').hidden) $('#sheet').hidden=true;
});
document.addEventListener('input', e => {
  const id = e.target.id;
  if (id==='ask'){ viewState.draft=e.target.value; autoGrow(); }
  if (id==='file-search'){ viewState.fileFilter=e.target.value; render(); }
  if (id==='note-q'){ viewState.noteQ=e.target.value; render(); }
  if (id==='ne-title' || id==='ne-body') saveNoteSoon();
  if (e.target.dataset.calc) runCalc(e.target.dataset.calc);
  if (e.target.matches?.('textarea[data-q]') && viewState.exam){ viewState.exam.ans[+e.target.dataset.q]=e.target.value; examProgress(); }
});
document.addEventListener('change', e => {
  if (e.target.id==='ne-course') saveNoteSoon();
  if (e.target.matches?.('input[type=radio][data-q]') && viewState.exam){ viewState.exam.ans[+e.target.dataset.q]=+e.target.value; examProgress(); }
  if (e.target.matches?.('input[type=checkbox][data-q]') && viewState.exam){ const q=e.target.dataset.q; viewState.exam.ans[+q]=[...document.querySelectorAll(`input[type=checkbox][data-q="${q}"]:checked`)].map(x=>+x.value); examProgress(); }
  if (e.target.id==='file-pick'){ uploadFiles([...e.target.files]); e.target.value=''; }
  if (e.target.id==='img-pick'){ [...e.target.files].slice(0,4).forEach(f=>viewState.images.push({blob:f,url:URL.createObjectURL(f)})); e.target.value=''; render(); }
});
document.addEventListener('submit', e => {
  e.preventDefault();
  const f = e.target.id;
  if (f==='task-form'){ put({kind:'task', title:$('#tf-title').value.trim(), due:$('#tf-due').value, type:$('#tf-type').value, course:$('#tf-course').value, done:false}); toast('Added to planner'); }
  if (f==='course-form'){ const n=$('#co-name').value.trim(); if(n && !all('course').some(c=>c.name===n)) put({kind:'course', name:n}); }
  if (f==='card-form'){ put({kind:'card', front:$('#cf-front').value.trim(), back:$('#cf-back').value.trim(), deck:$('#cf-deck').value.trim()||'General', box:1, next:todayISO()}); toast('Card added'); setTimeout(()=>$('#cf-front')?.focus(),0); }
  if (f==='exam-form'){
    const r=viewState.exam, left=r.idx.length-examAnswered(r);
    if (left && !viewState.examConfirm){ viewState.examConfirm=true; toast(`${left} question${left===1?'':'s'} still blank. Press Submit again to hand it in anyway.`); const first=r.idx.find(i=>!hasAns(r,i)); document.getElementById('q-'+first)?.scrollIntoView({behavior:'smooth',block:'center'}); return; }
    viewState.examConfirm=false; r.submitted=true; if(r.mode==='mc') examSave(); lsSet(EXAM_KEY,null); render(); window.scrollTo(0,0); return;
  }
  if (f==='log-form'){ put({kind:'log', date:todayISO(), minutes:+$('#log-min').value, course:''}); toast('Time logged'); }
});
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const d = e.target.closest?.('#drop'); if(!d) return;
  e.preventDefault();
  if (ev==='dragover') d.classList.add('over');
  else { d.classList.remove('over'); if(ev==='drop' && e.dataTransfer.files.length) uploadFiles([...e.dataTransfer.files]); }
}));
document.addEventListener('paste', e => {
  if (route!=='assistant') return;
  const imgs = [...(e.clipboardData?.files||[])].filter(f=>/^image\//.test(f.type));
  if (imgs.length){ imgs.slice(0,4).forEach(f=>viewState.images.push({blob:f,url:URL.createObjectURL(f)})); render(); }
});
window.addEventListener('hashchange', () => { readHash(); viewState.confirm=null; viewState.cheat=null; $('#sheet').hidden=true; render(); window.scrollTo(0,0); });

readHash(); render(); initStore();
})();
</script>
